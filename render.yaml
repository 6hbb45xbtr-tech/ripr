
services:
  - type: web
    name: cj-ripper-one-shot
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    # Install ffmpeg for mp3 conversion
    # Render supports apt via 'apt.txt' in the repo root.
